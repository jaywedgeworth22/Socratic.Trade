# Litestream config for the PRODUCTION app running on the Coolify box
# (socratictrade.com). Mirrors the Mac's ~/apps/trading-live/litestream.yml but
# with the container DB path. Same replica bucket/path as the Mac ran, so the
# restore at cutover reads the replica the Mac wrote, and post-cutover
# replication continues into the same history.
#
# All ${VARS} are injected at runtime by scripts/infisical-run.mjs (Infisical
# `prod` env) — no secrets live in this file. Used only by
# scripts/coolify-prod-start.sh; harmless everywhere else.
dbs:
  - path: /app/data/app.db
    # PITR snapshot policy (Litestream 0.5.x): snapshot interval + retention are
    # DB-level `snapshot:` settings (see the note in the Mac's litestream.yml).
    snapshot:
      interval: 24h
      retention: 720h # 30 days of snapshot history
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: trading-live/app.db
        region: ${LITESTREAM_S3_REGION:-auto}
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        access-key-id: ${LITESTREAM_S3_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_S3_SECRET_ACCESS_KEY}
