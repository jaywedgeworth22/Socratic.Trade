# Litestream config for the PRODUCTION app running on the Coolify box
# (socratictrade.com). Mirrors the Mac's ~/apps/trading-live/litestream.yml but
# with the container DB path. Same replica bucket/path as the Mac ran, so the
# restore at cutover reads the replica the Mac wrote, and post-cutover
# replication continues into the same history.
#
# All ${VARS} are injected at runtime by scripts/infisical-run.mjs (Infisical
# `prod` env) — no secrets live in this file. Used only by
# scripts/coolify-prod-start.sh; harmless everywhere else.
socket:
  enabled: true
  # Writable by the container `node` user. /var/run/litestream.sock fails with
  # "bind: permission denied" under Coolify (node is non-root), which left IPC
  # dead and /api/health stuck on storageDegraded=unavailable even while R2
  # replication was healthy. Keep next to the DB volume.
  path: /app/data/litestream.sock
  permissions: 0600

dbs:
  - path: /app/data/app.db
    # PITR snapshot policy (Litestream 0.5.x): snapshot interval + retention are
    # DB-level `snapshot:` settings (see the note in the Mac's litestream.yml).
    snapshot:
      interval: 24h
      retention: 720h # 30 days of snapshot history
    replicas:
      - type: s3
        # Throttles the R2 request rate. Litestream 0.5.x opens a NEW connection per
        # request to R2 and abandons the response without draining or closing it, so
        # every sync tick permanently pins a socket (measured: 100% ESTABLISHED,
        # keepalive-timer, frozen non-empty Recv-Q, ~34KB each). At the 1s default that
        # leaked ~15k sockets/hr, blew past net.ipv4.tcp_mem, and wedged every deploy at
        # git-clone via receive-window clamping. 10s cuts the leak rate 10x.
        # TRADEOFF: replica RPO 1s -> 10s. NOT a fix for the leak itself — see
        # docs/rollouts/2026-07-19-deploy-wedge-diagnosis.md.
        sync-interval: 10s
        bucket: ${AWS_S3_BUCKET_NAME}
        path: trading-live/app.db
        # Literal, not ${AWS_REGION:-auto}: litestream does its own ${VAR}
        # substitution and does NOT support bash `:-` defaults, so that form resolved to
        # an EMPTY region (confirmed in the startup banner: `region=""`). R2 wants "auto".
        region: auto
        endpoint: ${AWS_S3_ENDPOINT}
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
