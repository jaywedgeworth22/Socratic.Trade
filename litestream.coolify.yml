# Litestream config for the PRODUCTION app running on the Coolify box
# (socratictrade.com). Continuous SQLite backup to Backblaze B2 (S3-compatible).
#
# Destination (2026-08-07, owner): Backblaze B2 EU Central
#   bucket jays-socratic-trade-eu, endpoint s3.eu-central-003.backblazeb2.com
# Cloudflare R2 (`socratic-trade-bucket` etc.) is left as a historic object set —
# do not delete R2 until B2 restore is proven. Active replication no longer
# writes to R2.
#
# 2026-08-20 (owner, in conversation): THE B2 RESTORE HAS BEEN PROVEN. That condition is
# satisfied, so the historic R2 replica is now safe to prune. It is also the answer to
# "why is R2 bigger than a one-week snapshot should be": the bucket still holds the whole
# pre-cutover litestream object set (see the ~90k-object L1 backlog noted further down)
# ON TOP of cold-snapshots/app-<date>.db.
#
# !! FOOTGUN — READ BEFORE ANY PRUNE !!  BOTH replicas use the IDENTICAL object path
# `trading-live/app.db`; only bucket + endpoint differ:
#     R2  (DEAD, prunable)     bucket socratic-trade-bucket,   endpoint *.r2.cloudflarestorage.com
#     B2  (LIVE, DO NOT TOUCH) bucket jays-socratic-trade-eu,  endpoint s3.eu-central-003.backblazeb2.com
# Deleting `trading-live/**` against the wrong endpoint destroys the ACTIVE backup.
# Echo and eyeball endpoint + bucket before any delete; prune ONLY the R2 one.
#
# KEEP `cold-snapshots/**` in R2 — that prefix is the LIVE weekly second-provider DR lane
# (src/lib/r2-cold-snapshot.ts), not historic. Only `trading-live/**` is dead.
#
# All ${VARS} are injected at runtime by scripts/infisical-run.mjs (Infisical
# `prod` env) — no secrets live in this file. Used only by
# scripts/coolify-prod-start.sh; harmless everywhere else.
socket:
  enabled: true
  # Writable by the container `node` user. /var/run/litestream.sock fails with
  # "bind: permission denied" under Coolify (node is non-root), which left IPC
  # dead and /api/health stuck on storageDegraded=unavailable even while
  # replication was healthy. Keep next to the DB volume.
  path: /app/data/litestream.sock
  permissions: 0600

# Periodic LTX-sequence self-check (litestream 0.5.12: cmd/litestream/main.go's top-level
# `Config.Validation` field, wired through Store.ValidationInterval -> Store.Validate ->
# Replica.ValidateLevel in store.go). This is a GLOBAL key, not a per-database one -- litestream's
# own DBConfig struct has no `validation` field, only Config does, so it must live here at the
# top level of the file rather than nested under `dbs:`. Confirmed against the pinned v0.5.12
# source (github.com/benbjohnson/litestream, tag v0.5.12) before adding this.
#
# On each tick this walks every configured compaction level (except the snapshot level) and logs
# `validation error detected` (gap/overlap/unsorted) at WARN, or `validation check failed` at
# ERROR if the check itself errors -- both land in the same log stream `compaction failed` lines
# already use, which scripts/coolify-prod-start.sh tees to $DATA_DIR/litestream-runtime.log and
# src/lib/runtime-health.ts's scanLitestreamRuntimeLogFile() scans (see app/api/health/route.ts).
#
# Deliberately NOT `verify-compaction: true` (also a top-level key): that option LISTs the ENTIRE
# destination level after every single compaction -- at L1's ~90k-object backlog that is the same
# S3 request/socket-churn class that exhausted kernel tcp_mem and wedged every Coolify deploy on
# 2026-07-10 (docs/rollouts/2026-07-10-deploy-blocker-tcpmem-litestream.md). `validation.interval`
# runs on its own independent schedule (hourly here) instead of after every compaction, so it
# cannot reproduce that failure mode.
validation:
  interval: 1h

dbs:
  - path: /app/data/app.db
    # PITR snapshot policy (Litestream 0.5.x): snapshot interval + retention are
    # DB-level `snapshot:` settings.
    snapshot:
      interval: 24h
      # B2 is paid capacity (not CF free-tier) — keep 7d of LTX for restore headroom.
      retention: 168h
    replicas:
      - type: s3
        # Litestream 0.5.x can leak sockets at very short sync intervals against some
        # S3-compatible endpoints (historical R2 outage). 60s RPO is plenty for ST
        # and keeps Class A volume reasonable on B2.
        sync-interval: 60s
        bucket: ${AWS_S3_BUCKET_NAME}
        path: trading-live/app.db
        # Literal region required: litestream substitutes ${VAR} but does NOT support
        # bash `:-` defaults (empty region broke R2). B2 wants the cluster id, e.g.
        # eu-central-003 (set AWS_REGION accordingly in Infisical).
        region: ${AWS_REGION}
        endpoint: ${AWS_S3_ENDPOINT}
        # Required for Backblaze B2 S3 API (virtual-hosted style is unreliable).
        force-path-style: true
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
