name: SocraticTrade
options:
  bundleIdPrefix: com.socratictrade
  deploymentTarget:
    iOS: "16.0"
targets:
  SocraticTrade:
    type: application
    platform: iOS
    info:
      path: SocraticTrade/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources: [SocraticTrade]
