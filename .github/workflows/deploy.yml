name: Deploy

# Deploys the merged `main` branch to the self-hosted production host.
# Production runs `next start` under PM2 (app `trading`) from the
# `~/apps/trading-live` worktree, served at trading.jays.services.
# Activation + self-hosted-runner setup notes live in ci-pending/README.md.

on:
  # Auto-deploy every push to main (i.e. every merged PR).
  push:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancel it mid-build/restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Requires a self-hosted runner registered on the production box and carrying
    # BOTH of these labels. See ci-pending/README.md → "Self-hosted runner setup".
    runs-on: [self-hosted, trading-live]

    # Read access to repo contents is enough to fetch the code.
    permissions:
      contents: read

    # Optional overrides via repo Settings → Secrets and variables → Variables.
    # Defaults match the documented production layout; resolved with shell
    # fallbacks below so an unset variable still works.
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      PM2_APP: ${{ vars.PM2_APP }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Pull, build, and restart production
        shell: bash
        run: |
          set -euo pipefail
          DIR="${DEPLOY_DIR:-$HOME/apps/trading-live}"
          APP="${PM2_APP:-trading}"

          # Load the Infisical bootstrap if this box has been cut over to Infisical
          # (written by scripts/infisical-prod-cutover.sh; chmod 600, never committed,
          # lives outside the repo). Absent → plain build/restart, i.e. unchanged.
          ENV_FILE="$HOME/.config/agentic-trading/deploy.env"
          if [ -f "$ENV_FILE" ]; then set -a; . "$ENV_FILE"; set +a; echo "[deploy] loaded Infisical bootstrap from $ENV_FILE"; fi

          echo "::group::Update worktree ($DIR -> origin/main)"
          cd "$DIR"
          # The launchd runner has no stored git credentials / no TTY, so the
          # repo's HTTPS remote can't authenticate on its own. Fetch with the
          # job's GITHUB_TOKEN (auto-masked in logs).
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          # trading-live is a LINKED worktree sharing the clone with the main
          # integration worktree (which has `main` checked out), so we can't
          # check out `main` here. Hard-reset this worktree's working tree to the
          # fetched commit instead — no branch switch. Untracked files
          # (.env.local, data/app.db, data/logos/) are left untouched.
          git reset --hard FETCH_HEAD
          git --no-pager log --oneline -1
          echo "::endgroup::"

          echo "::group::Install dependencies (lockfile-exact)"
          npm ci
          echo "::endgroup::"

          echo "::group::Build (.next is regenerated)"
          # Build with secrets when an Infisical credential is present — either the
          # machine-identity Client ID + Client Secret (preferred, long-lived) or a
          # pre-minted INFISICAL_TOKEN. Otherwise plain build (unchanged pre-cutover).
          if { { [ -n "${INFISICAL_CLIENT_ID:-}" ] && [ -n "${INFISICAL_CLIENT_SECRET:-}" ]; } || [ -n "${INFISICAL_TOKEN:-}" ]; } \
               && command -v infisical >/dev/null 2>&1; then
            echo "[deploy] Infisical configured — building with secrets (build:secrets)"
            npm run build:secrets
          else
            echo "[deploy] Infisical not configured — plain build"
            npm run build
          fi
          echo "::endgroup::"

          echo "::group::Restart PM2 process ($APP)"
          pm2 restart "$APP" --update-env
          pm2 save
          echo "::endgroup::"
