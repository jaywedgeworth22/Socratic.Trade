# The `verify` job below is the REQUIRED status check gating every merge to `main`
# (enforced by the `main-protection` ruleset, not classic branch protection). It must be
# green before a PR can merge; `gh pr merge <n> --squash --auto` lands the PR once it passes.
#
# Docs-only fast path (2026-07-04): `classify` is a cheap first job that inspects the PR
# diff. When it touches ONLY documentation-class paths (*.md anywhere, docs/**), `verify`
# skips lint/tsc/test/build and reports success immediately instead of paying for a full
# install+build. The job is still NAMED `verify` and still reports a conclusion in both
# modes — only the trigger (`paths:`/`paths-ignore:` on the workflow) would leave the
# required check permanently pending on a skipped run, which is why this uses conditional
# steps inside the job instead. Classification is deliberately conservative: anything other
# than a pure-docs diff (code, configs, package.json, workflows, scripts, public/, etc.), or
# any push/merge_group event where a clean base..head diff isn't straightforward, runs the
# full gate unchanged.
name: CI

on:
  pull_request:
  # Required for the GitHub merge queue: the `verify` check must run on the
  # queue's temporary merge_group branch, or queued PRs hang forever.
  merge_group:
  push:
    branches:
      - main
      - "agent/**"

# Cancel a superseded run for the same branch/PR instead of letting it queue
# behind newer pushes — the single trading-live-mac runner was serializing a
# backlog of stale runs from repeated pushes to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    # Cheap gate-shape job: figure out if this diff is documentation-only so `verify`
    # can skip the expensive steps. Only `pull_request` gets the fast path — push/
    # merge_group always fall through to the full run (see docs-only output default).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Determine whether the diff is documentation-only
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event (${{ github.event_name }}) — running full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Missing base/head SHA — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base "$base" "$head" >/dev/null 2>&1; then
            echo "No merge-base found between base and head — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base...$head" 2>/dev/null || true)"
          if [ -z "$changed_files" ]; then
            echo "Could not compute a changed-files list — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          non_docs="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$|^docs/' || true)"
          if [ -z "$non_docs" ]; then
            echo "All changed files are documentation-class (*.md or docs/**) — docs-only fast path applies."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation files changed — running full gate:"
            echo "$non_docs"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: classify
    # Moved off the self-hosted runner (2026-07-01): this job is a generic
    # lint/typecheck/test/build with no dependency on the production box, and
    # was the main source of the runner queue bottleneck. Requires the repo's
    # GitHub Actions spending limit to be > $0 (Settings → Billing → Plans and
    # usage → Spending limit) — a $0 limit makes hosted jobs fail outright once
    # free minutes run out, which would then block merges since this is a
    # required status check. Revert to `[self-hosted, trading-live]` if that's
    # ever a problem.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - name: Docs-only short-circuit
        if: needs.classify.outputs.docs-only == 'true'
        run: echo "docs-only diff — gate skipped by path filter"
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs-only != 'true'
      - uses: actions/setup-node@v4
        if: needs.classify.outputs.docs-only != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Restore Next.js build cache
        if: needs.classify.outputs.docs-only != 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Install dependencies
        if: needs.classify.outputs.docs-only != 'true'
        shell: bash
        env:
          CONGRESS_TRADING_SHARED_DEPLOY_KEY: ${{ secrets.CONGRESS_TRADING_SHARED_DEPLOY_KEY }}
          # Drop GH_PAT from this chain: it is the Codex-Autofix PAT (repo + workflow scope, no
          # read:packages), so preferring it over the packages-scoped job GITHUB_TOKEN makes the
          # private-package install 403 when only GH_PAT is configured. (Review: PR #279.)
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/npm-ci-with-shared-deps.sh
      - if: needs.classify.outputs.docs-only != 'true'
        run: npm run lint
      - if: needs.classify.outputs.docs-only != 'true'
        run: npx tsc --noEmit
      - if: needs.classify.outputs.docs-only != 'true'
        run: npm test
      - if: needs.classify.outputs.docs-only != 'true'
        run: npm run build
