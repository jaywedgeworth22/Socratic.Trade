# The `verify` job below is the REQUIRED status check gating every merge to `main`
# (enforced by the `main-protection` ruleset, not classic branch protection). It must be
# green before a PR can merge; `gh pr merge <n> --squash --auto` lands the PR once it passes.
#
# Docs-only fast path (2026-07-04, PR #370): `classify` inspects the PR diff; when it touches
# ONLY documentation-class paths (*.md anywhere, docs/**) the gate reports success immediately
# without running the suite. Fail-closed in every ambiguous state.
#
# Hybrid resource-aware runner routing (2026-07-04, follow-up PR): the suite runs on the
# self-hosted Mac runner ONLY when the Mac itself advertises spare capacity, hosted otherwise.
# History matters here: verify was deliberately moved OFF the self-hosted runner on 2026-07-01
# because it was the runner-queue bottleneck. The owner re-confirmed hybrid AFTER that tradeoff
# was re-surfaced, with this resource-aware design:
#   - A Mac-side publisher (scripts/runner-availability.sh, pm2-run, owner-started) computes
#     availability (load, free RAM, runner alive, pm2 `trading` online) every 60s with
#     hysteresis and publishes the repo variable VERIFY_RUNNER_STATE = {"mode","ts"}.
#   - The `classify` job routes to the Mac ONLY when mode=self and ts is fresh (<5 min) on a
#     same-repo pull_request/push event. Busy, stale, absent, fork, schedule, merge_group ->
#     hosted instantly. A busy or asleep Mac never queues CI work.
#   - Linux is the arbiter: a verify-self FAILURE triggers exactly one automatic hosted re-run
#     (verify-hosted) and the gate takes the hosted result on disagreement. A self PASS stands.
#     A nightly scheduled hosted canary keeps a continuous Linux baseline on main.
#   - The `verify` gate job annotates which environment produced every result (audit receipt).
#   - Until the owner starts the Mac-side publisher, VERIFY_RUNNER_STATE is absent/stale and
#     EVERYTHING routes hosted - merging this file changes nothing until explicitly activated.
name: CI

on:
  pull_request:
  # Required for the GitHub merge queue: the `verify` check must run on the
  # queue's temporary merge_group branch, or queued PRs hang forever.
  merge_group:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    # Nightly hosted full-gate canary on main (continuous Linux baseline for the hybrid
    # design above; also refreshes the Linux .next cache even when main pushes route self).
    - cron: "47 7 * * *"

# Cancel a superseded run for the same branch/PR instead of letting it queue
# behind newer pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    # Cheap gate-shape job: (1) is this diff documentation-only? (2) which runner should
    # execute the suite? Only `pull_request` gets the docs fast path; only fresh
    # self-advertised availability on a same-repo pull_request/push event routes self.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.check.outputs.docs_only }}
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Determine whether the diff is documentation-only
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event (${{ github.event_name }}) — running full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Missing base/head SHA — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base "$base" "$head" >/dev/null 2>&1; then
            echo "No merge-base found between base and head — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames is load-bearing (Codex review, PR #370): with rename detection
          # active, `git diff --name-only` reports ONLY the destination path of a rename,
          # so `git mv src/foo.ts docs/foo.md` would list just docs/foo.md and classify as
          # docs-only while code was removed. --no-renames splits every rename into
          # delete(old)+add(new) so BOTH paths get classified.
          changed_files="$(git diff --name-only --no-renames "$base...$head" 2>/dev/null || true)"
          if [ -z "$changed_files" ]; then
            echo "Could not compute a changed-files list — running full gate to be safe."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          non_docs="$(printf '%s\n' "$changed_files" | grep -Ev '(^|/)[^/]+\.md$|^docs/' || true)"
          if [ -z "$non_docs" ]; then
            echo "All changed files are documentation-class (*.md or docs/**) — docs-only fast path applies."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation files changed — running full gate:"
            echo "$non_docs"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decide runner route (resource-aware hybrid)
        id: route
        shell: bash
        env:
          # Passed via env (not inline interpolation) so JSON quoting cannot break the script.
          STATE: ${{ vars.VERIFY_RUNNER_STATE }}
        run: |
          set -euo pipefail
          route=hosted
          reason="default"
          ev="${{ github.event_name }}"
          if [ "$ev" != "pull_request" ] && [ "$ev" != "push" ]; then
            reason="event '$ev' always runs hosted (merge_group/schedule/dispatch stay on Linux)"
          elif [ "$ev" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            reason="fork PRs never route to the self-hosted runner"
          elif [ -z "${STATE:-}" ]; then
            reason="VERIFY_RUNNER_STATE variable absent — Mac publisher not running"
          else
            mode="$(printf '%s' "$STATE" | jq -r '.mode // "hosted"' 2>/dev/null || echo hosted)"
            ts="$(printf '%s' "$STATE" | jq -r '.ts // 0' 2>/dev/null || echo 0)"
            now="$(date +%s)"
            age=$(( now - ts ))
            if [ "$mode" != "self" ]; then
              reason="Mac publisher reports mode=$mode"
            elif [ "$age" -gt 300 ] || [ "$age" -lt 0 ]; then
              reason="state stale (age ${age}s > 300s) — treating the Mac as unavailable"
            else
              route=self
              reason="Mac publisher reports mode=self and state is fresh (age ${age}s)"
            fi
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "Runner route: $route ($reason)"

  # Opportunistic self-hosted lane: free minutes when (and only when) the production Mac
  # advertises spare capacity. May fail without consequence — verify-hosted is the arbiter.
  verify-self:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.docs-only != 'true' && needs.classify.outputs.route == 'self' }}
    runs-on: [self-hosted, trading-live]
    timeout-minutes: 30
    # Single-file lane: this is load-shedding on the production box, NOT the throughput
    # path (hosted is always available in parallel for other runs via the router).
    concurrency:
      group: verify-self-hosted
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - name: Fail fast if the runner box is not sane
        shell: bash
        run: |
          command -v node >/dev/null 2>&1 || { echo "::error::node missing on the self-hosted runner — failing fast (hosted re-run will cover this)."; exit 1; }
          echo "node: $(node -v)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore Next.js build cache
        # runner.os = macOS here, so this is a separate cache namespace from the Linux
        # lineage — macOS restores never poison Linux builds and vice versa.
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Install dependencies (nice -19)
        shell: bash
        env:
          CONGRESS_TRADING_SHARED_DEPLOY_KEY: ${{ secrets.CONGRESS_TRADING_SHARED_DEPLOY_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        # Everything on the self path runs under `nice -n 19` so a live trading process
        # always outbids CI for CPU on the production box.
        run: nice -n 19 bash scripts/npm-ci-with-shared-deps.sh
      - run: nice -n 19 npm run lint
      - run: nice -n 19 npx tsc --noEmit
      - run: nice -n 19 npm test
      - run: nice -n 19 npm run build
      - name: Save Next.js build cache (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}

  # Hosted lane: the deterministic Linux baseline. Runs when routed hosted, and ALSO as the
  # exactly-one automatic re-run whenever the self lane did not succeed (failure, timeout,
  # or unexpected skip) — Linux is the arbiter on disagreement.
  verify-hosted:
    needs: [classify, verify-self]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.docs-only != 'true' && (needs.classify.outputs.route != 'self' || needs.verify-self.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Split restore/save (2026-07-04, cache-hygiene): PR/merge_group runs only restore;
      # a new entry is saved only on main pushes and the nightly schedule so cache storage
      # stays a single rolling lineage per OS instead of one throwaway entry per PR push.
      # cleanup-caches.yml deletes stray PR-ref entries on PR close and prunes older
      # lineage entries daily.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Install dependencies
        shell: bash
        env:
          CONGRESS_TRADING_SHARED_DEPLOY_KEY: ${{ secrets.CONGRESS_TRADING_SHARED_DEPLOY_KEY }}
          # Drop GH_PAT from this chain: it is the Codex-Autofix PAT (repo + workflow scope, no
          # read:packages), so preferring it over the packages-scoped job GITHUB_TOKEN makes the
          # private-package install 403 when only GH_PAT is configured. (Review: PR #279.)
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/npm-ci-with-shared-deps.sh
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Save Next.js build cache (main push + nightly canary)
        # The schedule leg keeps the Linux cache fresh even during stretches where every
        # main push routes to the Mac.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}

  # THE required check. Pure gate: interprets the lanes above and reports under the exact
  # context name the ruleset requires. Fail-closed in every ambiguous state; annotates which
  # environment produced the accepted result (the audit receipt).
  verify:
    needs: [classify, verify-self, verify-hosted]
    # `!cancelled()` (not `always()`) so superseded-run cancellation still cancels the gate,
    # while classify/lane failures cannot silently skip a required check (skipped required
    # checks can fail open — Codex review, PR #370).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate gate
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs-only }}
          ROUTE: ${{ needs.classify.outputs.route }}
          SELF_RESULT: ${{ needs.verify-self.result }}
          HOSTED_RESULT: ${{ needs.verify-hosted.result }}
        run: |
          set -euo pipefail
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note "### verify gate"
          note "- classify: ${CLASSIFY_RESULT} (docs-only: ${DOCS_ONLY:-n/a}, route: ${ROUTE:-n/a})"
          note "- verify-self (macOS, production Mac): ${SELF_RESULT}"
          note "- verify-hosted (ubuntu-latest): ${HOSTED_RESULT}"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            note "- RESULT: FAIL — classify did not succeed; the gate never fails open."
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            note "- RESULT: PASS — docs-only diff — gate skipped by path filter."
            exit 0
          fi
          if [ "$HOSTED_RESULT" = "success" ]; then
            if [ "$SELF_RESULT" = "failure" ]; then
              note "- RESULT: PASS — produced by hosted ubuntu-latest (ARBITER: self-hosted lane failed, hosted re-run passed; Linux result stands, likely a Mac-environment flake — check verify-self logs)."
            else
              note "- RESULT: PASS — produced by hosted ubuntu-latest."
            fi
            exit 0
          fi
          if [ "$HOSTED_RESULT" = "skipped" ] && [ "$SELF_RESULT" = "success" ]; then
            note "- RESULT: PASS — produced by self-hosted macOS (resource-aware route; suite is environment-agnostic and Linux baseline is re-validated nightly by the hosted canary)."
            exit 0
          fi
          note "- RESULT: FAIL — no successful lane (hosted: ${HOSTED_RESULT}, self: ${SELF_RESULT})."
          exit 1
