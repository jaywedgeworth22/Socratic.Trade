name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    - cron: "41 10 * * 1"

jobs:
  gitleaks:
    # Run only trusted same-repo PRs on the self-hosted production Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, trading-live]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
