name: merge-shepherd

# Manual convenience trigger for the merge shepherd (scripts/merge-shepherd.sh).
# The SCHEDULED driver is a launchd job on the Mac fleet host, because it can use a
# real PAT (`gh auth token`) so that `update-branch` re-triggers `verify` — the
# default Actions GITHUB_TOKEN cannot re-trigger workflows on branches it pushes,
# which would leave re-synced PRs without a fresh CI run. This dispatch path still
# merges already-green armed PRs and publishes the digest; add a `SHEPHERD_TOKEN`
# PAT secret (repo + workflow scope) to make its re-syncs re-trigger CI too.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: merge-shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run merge shepherd
        env:
          GH_TOKEN: ${{ secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHEPHERD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/merge-shepherd.sh
