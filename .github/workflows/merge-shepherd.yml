name: merge-shepherd

# Manual convenience trigger for the merge shepherd (scripts/merge-shepherd.sh).
# The SCHEDULED driver is a launchd job on the Mac fleet host, because it can use a
# real PAT (`gh auth token`) so that `update-branch` re-triggers `verify` — the
# default Actions GITHUB_TOKEN cannot re-trigger workflows on branches it pushes,
# which would leave re-synced PRs without a fresh CI run. This dispatch path still
# merges already-green armed PRs and publishes the digest; without a `SHEPHERD_TOKEN`
# PAT secret (repo + workflow scope), the script skips update-branch re-syncs and
# reports them instead of attempting a re-sync that GITHUB_TOKEN couldn't re-trigger
# CI for anyway. Add the secret to make re-syncs (and therefore CI re-triggers) work
# from this dispatch path too.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  # Referencing `environment: merge-shepherd` below makes GitHub create/update a
  # deployment record for each run; grant deployments:write explicitly since this
  # workflow already narrows GITHUB_TOKEN to an explicit allow-list (unlisted
  # scopes default to none).
  deployments: write

concurrency:
  group: merge-shepherd
  cancel-in-progress: false

jobs:
  shepherd:
    runs-on: ubuntu-latest
    # Server-side branch gate: the `merge-shepherd` GitHub Environment has a
    # deployment_branch_policy locked to `main` (custom_branch_policies=true,
    # branch policy "main" only -- configured via the Environments API, not
    # YAML). That policy is enforced by GitHub before the job is even
    # dispatched and cannot be edited by a branch's copy of this file, unlike
    # the `if:` guard below. Keep both: the `if:` guard is defense-in-depth
    # for the (rare) case the environment policy is ever removed or
    # misconfigured, and it's what actually skips the job cleanly rather than
    # failing environment protection checks.
    environment: merge-shepherd
    # A manual workflow_dispatch run against a non-main branch loads THAT branch's
    # copy of this workflow file before any step runs -- so a branch could edit this
    # file to add steps using SHEPHERD_TOKEN/GITHUB_TOKEN. Refuse to run the job at
    # all unless the dispatch itself targeted main, before either token is exposed
    # to any step. (The checkout pin below is a second, redundant safeguard: even a
    # main-triggered run always executes main's copy of the script.)
    if: github.ref == 'refs/heads/main'
    steps:
      # Pin to main regardless of which ref the dispatch was run against, so a
      # workflow_dispatch from a non-main branch can never run a branch-modified
      # copy of the script with this job's write-scoped token.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run merge shepherd
        env:
          GH_TOKEN: ${{ secrets.SHEPHERD_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHEPHERD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SHEPHERD_HAS_PAT: ${{ secrets.SHEPHERD_TOKEN != '' && '1' || '0' }}
        run: bash scripts/merge-shepherd.sh
