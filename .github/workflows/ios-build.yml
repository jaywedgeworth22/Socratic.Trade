name: iOS build (Mac runner)

# Compile-check and run XCTests for the iOS app on the self-hosted Mac runner
# (mac-xcode26-socratic).  xcodebuild output is redirected to a file so
# SWBBuildService cannot hold the Actions step pipe open after the process exits.
#
# XCODE BUILDS ONLY (owner directive, 2026-08-12): this is the sole workflow
# that may target the mac-runner labels; everything else stays on hosted/Linux
# runners. Label routing enforces that — nothing lands on the Mac unless a
# workflow asks for these labels.
#
# The Mac carries stable Xcode 26.x and Xcode-beta 27 side by side. A binary
# built against the beta SDK passes TestFlight upload but is rejected at App
# Store submission as INVALID_BINARY (Congress.Trade 1.0 hit this twice). CI
# pins DEVELOPER_DIR to stable and asserts the version so a stray xcode-select
# can never silently move builds onto the beta.
#
# Deliberately unsigned (CODE_SIGNING_ALLOWED=NO) and no archive/upload —
# TestFlight shipping stays in the fleet ship script, which has its own guard.

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (unsigned)
    # Self-hosted Mac: never run fork PRs on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode26]
    # Cold builds have printed BUILD SUCCEEDED in ~21m, then hung until timeout because
    # SWBBuildService inherited the step pipe.  Warm builds on this runner finish in
    # under a minute.  40m covers a cold build plus the new test step; the file
    # redirect below is what actually lets the step exit.
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Assert stable Xcode 26 (never beta)
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          case "$ver" in
            26.*) echo "stable Xcode $ver — OK" ;;
            *)
              echo "::error::Expected stable Xcode 26.x, got '$ver'. A beta-SDK build passes TestFlight but is rejected at App Store submission as INVALID_BINARY."
              exit 1
              ;;
          esac
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac

      - name: Build SocraticTrade (generic iOS device, unsigned)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/xcodebuild-build.log"
          # SWBBuildService outlives xcodebuild and inherits its stdout.  Left on the
          # runner's own pipe it holds the step open until timeout-minutes kills it,
          # even on a build that already printed BUILD SUCCEEDED.  A file breaks that
          # inheritance.  See docs/rollouts/2026-08-21-ios-adaptive-tabs-followups.md
          # item C and docs/rollouts/2026-08-21-ios-ci-unhang.md.
          set +e
          xcodebuild build \
            -project 'ios/Socratic Trade.xcodeproj' \
            -scheme SocraticTrade \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > "$log" 2>&1 < /dev/null
          status=$?
          set -e
          tail -300 "$log"
          exit $status

      - name: Test SocraticTrade (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          # Prefer iPhone 17 Pro (AGENTS.md).  Fall back to any available iPhone so a
          # missing named device cannot skip the lane.  Do not share a human-booted
          # simulator when a dedicated match exists — pick by name from `available`.
          iphone=$(
            xcrun simctl list devices available \
              | awk -F '[()]' '/iPhone / {
                  name=$1
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
                  print name
                }' \
              | awk '
                  $0 == "iPhone 17 Pro" { p17 = $0 }
                  $0 == "iPhone 16 Pro" { p16 = $0 }
                  $0 ~ /^iPhone / { if (first == "") first = $0 }
                  END {
                    if (p17 != "") print p17
                    else if (p16 != "") print p16
                    else print first
                  }
                '
          )
          if [ -z "$iphone" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $iphone"
          log="$RUNNER_TEMP/xcodebuild-test.log"
          set +e
          xcodebuild test \
            -project 'ios/Socratic Trade.xcodeproj' \
            -scheme SocraticTrade \
            -destination "platform=iOS Simulator,name=$iphone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > "$log" 2>&1 < /dev/null
          status=$?
          set -e
          tail -300 "$log"
          exit $status
