# Actions-cache hygiene (2026-07-04). The repo hit its 10 GB per-repo cache cap because
# (a) every PR's cache-save (before ci.yml's restore/save split landed) left a ~340MB `.next`
# entry scoped to that PR's ref that outlived the PR — GitHub only evicts caches when the
# 10 GB cap is exceeded, oldest-first, so stale PR entries just accumulated; and (b) even
# on `main`, every push saved a brand-new entry (the key includes a source-tree hash) without
# ever removing the previous one, so `main` itself accumulated a growing entry list rather
# than a single rolling one.
#
# ci.yml's `verify` job now only SAVES a new `.next/cache` entry on pushes to `main` (PR and
# merge_group runs restore-only). This workflow is the backstop / cleanup layer:
#   1. On every PR close (merged or not), delete all caches scoped to that PR's ref
#      (`refs/pull/<n>/merge`) so a forgotten PR cache can't linger.
#   2. On a daily schedule, prune every branch/tool cache down to just its single most
#      recently created entry — covers `main`'s Next.js/npm caches, and incidentally also
#      catches the small long-lived tool caches (gitleaks, bun) if they ever start
#      duplicating. This is a backstop, not the primary control (the ci.yml restore/save
#      split is): safe to run even if item 1 already did its job, since there is nothing left
#      to prune on well-behaved refs.
name: Cleanup Actions Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "5 3 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-caches
  cancel-in-progress: false

jobs:
  delete-pr-caches:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, socratic-ci]
    steps:
      - name: Delete every cache scoped to this PR's ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          echo "Deleting caches for ref ${PR_REF}..."
          gh cache delete --all --ref "$PR_REF" --succeed-on-no-caches --repo "$REPO"

  prune-stale-caches:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, socratic-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/prune-stale-actions-caches.py
          sparse-checkout-cone-mode: false
      - name: Keep only the newest entry per cache key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Current cache inventory:"
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt,sizeInBytes

          # Group by (key prefix before the trailing content hash, ref) and delete everything
          # except the most-recently-created id in each group -- see
          # scripts/prune-stale-actions-caches.py for the grouping rule.
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt \
            | python3 scripts/prune-stale-actions-caches.py > /tmp/prune_ids.txt

          if [ ! -s /tmp/prune_ids.txt ]; then
            echo "Nothing to prune — every cache key/ref group already has a single entry."
            exit 0
          fi

          echo "Pruning $(wc -l < /tmp/prune_ids.txt) stale cache entries:"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting cache id $id"
            gh cache delete "$id" --repo "$REPO" || echo "::warning::failed to delete cache $id (already gone?)"
          done < /tmp/prune_ids.txt

      - name: Disable sparse checkout (prevent poisoning self-hosted runner workspace)
        if: always()
        shell: bash
        run: |
          git sparse-checkout disable || true
