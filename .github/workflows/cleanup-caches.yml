name: Cleanup Actions Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "5 3 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-caches
  cancel-in-progress: false

jobs:
  delete-pr-caches:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub CLI is on PATH
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          # Pin gh CLI. Do not follow /releases/latest. Checksums from
          # https://github.com/cli/cli/releases/tag/v2.98.0
          GH_VERSION=2.98.0
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64; sha=3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de ;;
            aarch64|arm64) arch=arm64; sha=cf689084f3a3618f7eae4a2420d335d74626d65f5e594b9828d125d69f800d86 ;;
            *) echo "::error::unsupported arch $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tarball="/tmp/gh_${GH_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${arch}.tar.gz" -o "$tarball"
          echo "${sha}  ${tarball}" | sha256sum -c -
          tar -xz -C /tmp -f "$tarball"
          install -m 0755 "/tmp/gh_${GH_VERSION}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version
      - name: Delete every cache scoped to this PR's ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          echo "Deleting caches for ref ${PR_REF}..."
          gh cache delete --all --ref "$PR_REF" --succeed-on-no-caches --repo "$REPO"

  prune-stale-caches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub CLI is on PATH
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          # Pin gh CLI. Do not follow /releases/latest. Checksums from
          # https://github.com/cli/cli/releases/tag/v2.98.0
          GH_VERSION=2.98.0
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64; sha=3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de ;;
            aarch64|arm64) arch=arm64; sha=cf689084f3a3618f7eae4a2420d335d74626d65f5e594b9828d125d69f800d86 ;;
            *) echo "::error::unsupported arch $arch"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          tarball="/tmp/gh_${GH_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${arch}.tar.gz" -o "$tarball"
          echo "${sha}  ${tarball}" | sha256sum -c -
          tar -xz -C /tmp -f "$tarball"
          install -m 0755 "/tmp/gh_${GH_VERSION}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version
      - name: Keep only the newest entry per cache key prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Current cache inventory:"
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt,sizeInBytes

          # Group by (key prefix before the trailing content hash, ref) and delete everything
          # except the most-recently-created id in each group -- see
          # scripts/prune-stale-actions-caches.py for the grouping rule.
          gh cache list --repo "$REPO" --limit 100 --json id,key,ref,createdAt \
            | python3 scripts/prune-stale-actions-caches.py > /tmp/prune_ids.txt

          if [ ! -s /tmp/prune_ids.txt ]; then
            echo "Nothing to prune — every cache key/ref group already has a single entry."
            exit 0
          fi

          echo "Pruning $(wc -l < /tmp/prune_ids.txt) stale cache entries:"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting cache id $id"
            gh cache delete "$id" --repo "$REPO" || echo "::warning::failed to delete cache $id (already gone?)"
          done < /tmp/prune_ids.txt
