name: iOS TestFlight ship (Mac runner)

# Archive + upload on the owned Mac runner so TestFlight (the phone) actually
# updates when iOS code lands on main. Unsigned compile stays in ios-build.yml.
#
# XCODE BUILDS ONLY (owner 2026-08-12): this workflow may target mac-runner
# labels. Backend jobs stay off this host. Fork PRs never run here.
#
# Secrets stay on the Mac (~/.secrets/appstore-connect.env). Nothing is
# checked into GitHub. The fleet ship script also declares export compliance
# so a missing ITSAppUsesNonExemptEncryption cannot leave a VALID-but-unusable
# build (ST 1.0.1/2, 2026-08-12).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ship.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: ios-ship-socratic
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false
    runs-on: [self-hosted, macOS, ARM64, xcode26]
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The default depth-1 checkout
      # leaves the runner workspace with exactly ONE commit (verified 2026-08-13:
      # `git rev-parse --is-shallow-repository` -> true, `rev-list --count HEAD` -> 1),
      # so `git log <last-shipped-sha>..HEAD` fails with "unknown revision" and the
      # TestFlight "What to Test" release notes the fleet ship script now generates
      # would silently come out empty on every CI ship.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Assert stable Xcode 26 (never beta)
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          ver=$(xcodebuild -version | awk 'NR==1{print $2}')
          case "$ver" in
            26.*) echo "stable Xcode $ver — OK" ;;
            *)
              echo "::error::Expected stable Xcode 26.x, got '$ver'."
              exit 1
              ;;
          esac

      # Route through the in-repo wrapper, not the runtime fleet path directly.
      # The wrapper verifies scripts/ios-fleet.sha256 first, so a change to the
      # untracked /Users/jay/apps/ios-fleet tooling cannot silently alter what this
      # repo ships (it is not a git repo -- no history, no review, and apps.json
      # there carries this app's version train).
      #
      # No IOS_TF_MIN_INTERVAL_SEC here. That variable is a PER-RUN override; this
      # workflow used to pin it to 3600, which quietly halved the documented fleet
      # standing gate of 2.5h (DEFAULT_MIN_INTERVAL_SEC=9000 in the fleet script,
      # 2.5h in its README). Live evidence of the halving, consecutive ST upload
      # gaps from App Store Connect: 2.80h and 2.58h before the override, then 1.60h
      # and 1.34h after. The commit that added it (d6c79765) was fixing trailing
      # commits stranded by the no-push-event defect -- and the `schedule` cron it
      # added in the same commit already fixes that, because once the interval
      # expires the next 30-minute tick sees HEAD != last-shipped sha and ships.
      # If the owner wants 1h, change DEFAULT_MIN_INTERVAL_SEC + the fleet README
      # together so it applies fleet-wide and stays documented.
      - name: Ship SocraticTrade to TestFlight
        run: bash scripts/ios-ship-testflight.sh
