name: Playwright Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Moved off the self-hosted runner (2026-07-01): playwright.config.ts already
    # builds and serves its own local `next start` on 127.0.0.1 and only talks to
    # itself (no live production/broker dependency), and the Linux/RUNNER_OS
    # branch below was already written anticipating a hosted Linux runner. This
    # job was contributing to the runner queue bottleneck. Revert to
    # `[self-hosted, trading-live]` if the account's Actions spending limit ever
    # blocks this (Settings → Billing → Plans and usage → Spending limit).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        env:
          CONGRESS_TRADING_SHARED_DEPLOY_KEY: ${{ secrets.CONGRESS_TRADING_SHARED_DEPLOY_KEY }}
        run: bash scripts/npm-ci-with-shared-deps.sh
      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run test:e2e
