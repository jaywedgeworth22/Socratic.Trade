name: Playwright Smoke

on:
  pull_request:
  # Required for the GitHub merge queue: the `smoke` check must run on the
  # queue's temporary merge_group branch, or queued PRs hang forever.
  merge_group:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Moved off the self-hosted runner (2026-07-01): playwright.config.ts already
    # builds and serves its own local `next start` on 127.0.0.1 and only talks to
    # itself (no live production/broker dependency), and the Linux/RUNNER_OS
    # branch below was already written anticipating a hosted Linux runner. This
    # job was contributing to the runner queue bottleneck. Revert to
    # `[self-hosted, trading-live]` if the account's Actions spending limit ever
    # blocks this (Settings → Billing → Plans and usage → Spending limit).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run this job (it installs deps with a private-repo deploy key secret)."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs with this secret (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      # Restore Next.js's incremental build cache so the playwright webServer's `npm run build`
      # (playwright.config.ts) reuses prior compilation output instead of paying a full cold build
      # every run. Keyed on lockfile + source so it invalidates when deps or code change, with a
      # loosened restore-key fallback so a source-only change still warm-starts from the last build.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - run: npm run test:e2e
