name: Playwright Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    - cron: "17 9 * * 1"

jobs:
  smoke:
    # Start the required check even for untrusted PRs so branch protection cannot
    # be satisfied by a skipped job, then fail closed before checkout.
    runs-on: [self-hosted, trading-live]
    permissions:
      contents: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run on the self-hosted production runner."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs on the self-hosted production runner (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        env:
          CONGRESS_TRADING_SHARED_DEPLOY_KEY: ${{ secrets.CONGRESS_TRADING_SHARED_DEPLOY_KEY }}
        run: |
          if [ -n "${CONGRESS_TRADING_SHARED_DEPLOY_KEY:-}" ]; then
            key_file="${RUNNER_TEMP:-/tmp}/congress_trading_shared_deploy_key"
            mkdir -p "$(dirname "$key_file")" "$HOME/.ssh"
            printf '%s\n' "$CONGRESS_TRADING_SHARED_DEPLOY_KEY" > "$key_file"
            chmod 600 "$key_file"
            ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          fi
          npm ci
      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run test:e2e
