name: Playwright Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  schedule:
    - cron: "17 9 * * 1"

jobs:
  smoke:
    # Start the required check even for untrusted PRs so branch protection cannot
    # be satisfied by a skipped job, then fail closed before checkout.
    runs-on: [self-hosted, trading-live]
    permissions:
      contents: read
    steps:
      - name: Refuse untrusted PR source
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot run on the self-hosted production runner."
            exit 1
          fi
          actor="${{ github.actor }}"
          if printf '%s' "$actor" | grep -Eq '\[bot\]$'; then
            case "$actor" in
              'cursor[bot]'|'dependabot[bot]')
                echo "Trusted same-repo bot: $actor"
                ;;
              *)
                echo "::error::Bot PRs cannot run package installs on the self-hosted production runner (untrusted bot: $actor)."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        env:
          JOB_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dep_token="$(GH_TOKEN= GITHUB_TOKEN= gh auth token 2>/dev/null || true)"
          dep_token="${dep_token:-$JOB_GITHUB_TOKEN}"
          auth="$(printf 'x-access-token:%s' "$dep_token" | base64 | tr -d '\n')"
          git config --local --unset-all http.https://github.com/.extraheader || true
          GIT_CONFIG_COUNT=3 \
            GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf \
            GIT_CONFIG_VALUE_0=ssh://git@github.com/ \
            GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf \
            GIT_CONFIG_VALUE_1=git@github.com: \
            GIT_CONFIG_KEY_2=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $auth" \
            npm ci
      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - run: npm run test:e2e
