version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    # Keep the compiler and runtime declarations inside their reviewed support
    # windows. Remove or narrow a guard only in the same PR as the migration.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      observability:
        patterns:
          - "@sentry/*"
          - "@langfuse/*"
          - "@opentelemetry/*"
      testing:
        patterns:
          - "vitest"
          - "@playwright/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
