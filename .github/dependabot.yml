version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      observability:
        patterns:
          - "@sentry/*"
          - "@langfuse/*"
          - "@opentelemetry/*"
      testing:
        patterns:
          - "vitest"
          - "@playwright/*"
